<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Clap Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>GYM TIMER</h1>

        <div id="timer-display">00:00:00</div>

        <div class="controls">
            <label for="threshold-input">Threshold:</label>
            <input type="number" id="threshold-input" step="0.01" value="0.08">
            <button id="set-threshold-btn">Set</button>
            <button id="start-mic-btn">Start Listening</button>
        </div>

        <div class="volume-info">
            <span>Max Vol: <span id="max-vol">0.000</span></span>
            <span>Live Vol: <span id="live-vol">0.000</span></span>
        </div>

        <div id="status-bar">Press "Start Listening" and allow microphone access.</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
